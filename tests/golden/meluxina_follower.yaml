name: hpc-follower
inputs:
  parameters:
  - name: step-name
  - name: image
  - name: step-command
  - name: time-limit
  - name: deadline-seconds
  - name: step-outputs
    value: ''
  - name: hpc-class
  - name: resumable-lead
    value: '0'
  - name: resumable
    value: auto
  - name: idle-timeout
    value: ''
activeDeadlineSeconds: '{{inputs.parameters.deadline-seconds}}'
retryStrategy:
  limit: '2'
  retryPolicy: Always
  expression: lastRetry.status == 'Error' or lastRetry.message matches '.*(imminent
    node shutdown|node is shutting down|node is draining|The node was low on resource|The
    node had condition|Pod was rejected|Evicted|evicted|pod deleted|Pod was deleted).*'
metadata:
  labels:
    platform.kubecore.io/compute-type: hpc
    platform.kubecore.io/hpc-class: '{{inputs.parameters.hpc-class}}'
outputs:
  parameters:
  - name: slurm-job-id
    valueFrom:
      path: /tmp/slurm-job-id
  - name: dataset-info
    valueFrom:
      path: /tmp/outputs/dataset-info.json
      default: '{}'
  - name: params
    valueFrom:
      path: /tmp/outputs/params.json
      default: '{}'
container:
  image: registry.example/kaos-hpc-operator:v1.2.3
  command:
  - /follower
  env:
  - name: HPC_JOB_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: WF_NAME
    value: '{{workflow.name}}'
  - name: WF_UID
    value: '{{workflow.uid}}'
  - name: STEP_NAME
    value: '{{inputs.parameters.step-name}}'
  - name: NODE_KEY
    value: '{{inputs.parameters.step-name}}-meluxina'
  - name: IMAGE_REF
    value: '{{inputs.parameters.image}}'
  - name: STEP_COMMAND
    value: '{{inputs.parameters.step-command}}'
  - name: SLURM_TIME_LIMIT
    value: '{{inputs.parameters.time-limit}}'
  - name: HPC_CLASS
    value: '{{inputs.parameters.hpc-class}}'
  - name: HPC_RESUMABLE_LEAD
    value: '{{inputs.parameters.resumable-lead}}'
  - name: HPC_RESUMABLE
    value: '{{inputs.parameters.resumable}}'
  - name: HPC_IDLE_TIMEOUT_MINUTES
    value: '{{inputs.parameters.idle-timeout}}'
  - name: HPC_MAX_CONTINUATIONS
    value: '5'
  - name: STEP_OUTPUTS
    value: '{{inputs.parameters.step-outputs}}'
  - name: DATASET
    value: '{{workflow.parameters.dataset}}'
  - name: OUTPUTS_REPO
    value: outputs-PLACEHOLDER-app
  - name: OUTPUTS_REF
    value: main
  - name: CHECKPOINT_BUCKET
    value: outputs-PLACEHOLDER-app
  - name: CHECKPOINT_PREFIX
    value: main/checkpoints
serviceAccountName: hpc-submitter
