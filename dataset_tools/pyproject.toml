[project]
name = "kubecore-dataset"
version = "1.2.0"
description = "Log in, validate, and incrementally sync YOLO-pose datasets to lakeFS for the KAOS ML pipeline dropdown."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
kubecore-dataset = "dataset_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dataset_cli"]
