site_name: Hera Pipeline Guide
site_description: A friendly, step by step guide to building your own Hera pipeline from this template
site_author: Novelcore
site_url: https://novelcore.github.io/hera-pipeline-template/

repo_name: novelcore/hera-pipeline-template
repo_url: https://github.com/novelcore/hera-pipeline-template
edit_uri: edit/dev/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelcore/hera-pipeline-template

nav:
  - Start here: index.md
  - Cookbook:
      - 1. You are in: cookbook/01-you-are-in.md
      - 2. Your project: cookbook/02-your-project.md
      - 3. Install kaosctl: cookbook/03-install-kaosctl.md
      - 4. Create a dataset: cookbook/04-create-a-dataset.md
      - 5. Create your pipeline: cookbook/05-create-your-pipeline.md
      - 6. Change a step and push: cookbook/06-change-a-step.md
      - 7. Run it: cookbook/07-run-it.md
      - 8. See the results: cookbook/08-see-results.md
      - 9. Share a dataset: cookbook/09-share-a-dataset.md
      - 10. When things go wrong: cookbook/10-when-things-go-wrong.md
  - Reference:
      - What you need: what-you-need.md
      - Get the project: get-the-project.md
      - How it works: how-it-works.md
      - Add a step: add-a-step.md
      - Remove a step: remove-a-step.md
      - Change a setting: change-a-setting.md
      - Send your change in: send-it-in.md
      - Go live: go-live.md
      - Run your pipeline: run-it.md
      - kaos-lib versions: kaos-lib-versions.md
      - Troubleshooting: troubleshooting.md
      - Word list: glossary.md

copyright: "Copyright &copy; 2026 Novelcore"
