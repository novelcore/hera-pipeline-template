site_name: Hera Pipeline Guide
site_description: The engineer's cookbook for KAOS ML pipelines - from your first sign-in to comparing trained weights
site_author: Novelcore
site_url: https://novelcore.github.io/hera-pipeline-template/

repo_name: novelcore/hera-pipeline-template
repo_url: https://github.com/novelcore/hera-pipeline-template
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelcore/hera-pipeline-template

nav:
  - Cookbook:
      - Your first day: index.md
      - 1. You're in: cookbook/1-youre-in.md
      - 2. Your project's apps: cookbook/2-your-apps.md
      - 3. Your tools: cookbook/3-your-tools.md
      - 4. Install kaosctl and sign in: cookbook/4-install-kaosctl.md
      - 5. Your data: cookbook/5-your-data.md
      - 6. Your pipeline: cookbook/6-your-pipeline.md
      - 7. Run it: cookbook/7-run-it.md
      - 8. Results and weights: cookbook/8-results-and-weights.md
      - 9. The yolo use case: cookbook/9-the-yolo-use-case.md
      - 10. When things go wrong: cookbook/10-when-things-go-wrong.md
  - Guides:
      - First dataset and run: first-run.md
      - Upload images and labels for yolo: guide-upload-yolo.md
      - Add a step that reads the dataset: guide-step-with-data.md
      - Run on a released version: guide-run-on-a-version.md
  - Datasets:
      - What a dataset is: datasets.md
      - Create a dataset: dataset-create.md
      - Add or change data: dataset-upload.md
      - Check a dataset: dataset-validate.md
      - Release a version: dataset-release.md
      - Download a dataset: dataset-pull.md
      - Share a dataset: dataset-share.md
      - Use a dataset in a step: dataset-in-a-step.md
  - Pipelines:
      - How it works: how-it-works.md
      - Add a step: add-a-step.md
      - Write results from a step: write-a-step.md
      - Remove a step: remove-a-step.md
      - Change a setting: change-a-setting.md
      - Send your change in and go live: send-it-in.md
      - Run your pipeline: run-it.md
  - Results: results.md
  - MeluXina: meluxina.md
  - kaos-lib:
      - Versions and upgrades: kaos-lib-versions.md
      - kaos-lib reference: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/index.html
  - Word list: glossary.md

copyright: "Copyright &copy; 2026 Novelcore"
