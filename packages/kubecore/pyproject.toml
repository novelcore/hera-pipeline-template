[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubecore"
version = "0.2.0"
description = "KAOS platform package: datasets (formats, versions), run outputs and the kubecore CLI over kaos-lake."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
zitadel = ["PyJWT>=2.8", "cryptography>=41"]   # machine-key tokens for datasets shared by other projects
test = ["pytest>=7", "PyJWT>=2.8", "cryptography>=41"]

[project.scripts]
kubecore = "kubecore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
